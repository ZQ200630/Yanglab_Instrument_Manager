[workspace]
resolver = "2"
members = ["App/protocol", "App/src-tauri"]
default-members = ["App/protocol"]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
windows-sys = "=0.61.2"
