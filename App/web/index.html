<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Yang LAB INSTRUMENT CONSOLE</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Instrument navigation">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>Yang LAB</strong><small>INSTRUMENT CONSOLE</small></div>
        </div>
        <div class="sidebar-group-label">WORKSPACE</div>
        <nav id="navigation" class="navigation"></nav>
        <div class="sidebar-bottom">
          <div class="sidebar-run-dot" id="sidebar-run-dot"></div>
          <div><strong id="sidebar-mode">Local Host</strong><small id="sidebar-subtitle">Disconnected</small></div>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="breadcrumb"><span>YANG LAB</span><span class="breadcrumb-separator">/</span><strong id="current-page-title">Overview</strong></div>
          <div class="topbar-actions">
            <span class="clock" id="clock"></span>
            <span class="session-pill" id="session-pill"><span class="pill-dot"></span> Offline</span>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="background-work" class="background-work" hidden></div>
        <div id="content" class="content"></div>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
